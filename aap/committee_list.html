<!-- committee_list.html -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 relative">
  
  <!-- ক) উপদেষ্টা মণ্ডলী সেকশন -->
  <div class="mb-16">
    <div class="text-center mb-10">
      <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-extrabold uppercase">উপদেষ্টা প্যানেল</span>
      <h3 class="text-3xl font-extrabold text-gray-800 mt-2">আমাদের উপদেষ্টা মণ্ডলী</h3>
      <div class="w-16 h-1 bg-emerald-500 mx-auto mt-3 rounded-full"></div>
    </div>
    
    <!-- ৪-কলামের সুন্দর রেসপন্সিভ গ্রিড লেআউট -->
    <div id="advisors-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- উপদেষ্টা কার্ড রেন্ডার হবে -->
    </div>
  </div>

  <!-- খ) কার্যনির্বাহী কমিটি সেকশন -->
  <div>
    <div class="text-center mb-10">
      <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-extrabold uppercase">পরিচালনা পর্ষদ</span>
      <h3 class="text-3xl font-extrabold text-gray-800 mt-2">আমাদের কার্যনির্বাহী কমিটি</h3>
      <div class="w-16 h-1 bg-emerald-500 mx-auto mt-3 rounded-full"></div>
    </div>
    
    <!-- ৪-কলামের সুন্দর রেসপন্সিভ গ্রিড লেআউট -->
    <div id="executives-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- পরিচালনা পর্ষদ কার্ড রেন্ডার হবে -->
    </div>
  </div>

  <div id="committee-loader" class="text-center py-12">
    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mx-auto mb-4"></div>
  </div>

  <!-- ১. কলিং নাম্বার প্রদর্শনীর স্টাইলিশ পপআপ মডাল -->
  <div id="phone-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50 backdrop-blur-sm transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-gray-100 transform scale-95 transition-transform duration-300 relative">
      <button onclick="closePhoneModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div class="text-center space-y-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto">
          <i class="fa-solid fa-phone text-lg"></i>
        </div>
        <div>
          <h4 class="text-gray-800 font-black text-base" id="modal-member-name">সদস্যের নাম</h4>
          <p class="text-xs text-gray-400 mt-0.5" id="modal-member-designation">পদবী</p>
        </div>
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
          <span class="text-gray-400 text-[10px] uppercase font-bold block">মোবাইল নম্বর</span>
          <a href="" id="modal-phone-link" class="text-lg font-black text-emerald-600 tracking-wide hover:underline mt-1 block select-all">০১৭XXXXXXXX</a>
        </div>
        <div class="flex gap-2">
          <button onclick="closePhoneModal()" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">বন্ধ করুন</button>
          <a href="" id="modal-call-btn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center justify-center gap-1.5 shadow-md shadow-emerald-100">
            <i class="fa-solid fa-phone text-[10px]"></i> সরাসরি কল
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ২. বিস্তারিত তথ্য প্রদর্শনীর পপআপ মডাল -->
  <div id="details-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/50 backdrop-blur-sm transition-opacity duration-300">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-gray-100 transform scale-95 transition-transform duration-300 relative">
      <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div class="space-y-4">
        <div class="text-center">
          <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3">
            <i class="fa-solid fa-circle-user text-lg"></i>
          </div>
          <h4 class="text-gray-800 font-black text-base" id="details-member-name">সদস্যের নাম</h4>
          <span class="inline-block mt-1 px-3 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-100" id="details-member-designation">পদবী</span>
        </div>
        
        <div class="space-y-3 text-xs border-t border-slate-50 pt-4">
          <div class="flex items-start gap-2.5">
            <i class="fa-solid fa-briefcase text-slate-400 w-4 text-center mt-0.5"></i>
            <div>
              <span class="text-[10px] text-gray-400 uppercase font-bold block">পেশা ও সংগঠন</span>
              <span class="text-gray-700 font-bold" id="details-member-org">-</span>
            </div>
          </div>
          <div class="flex items-start gap-2.5">
            <i class="fa-solid fa-location-dot text-slate-400 w-4 text-center mt-0.5"></i>
            <div>
              <span class="text-[10px] text-gray-400 uppercase font-bold block">ঠিকানা</span>
              <span class="text-gray-700 font-medium">আউলিযাপুর ইউনিয়ন, পটুয়াখালী সদর</span>
            </div>
          </div>
          <div class="flex items-start gap-2.5">
            <i class="fa-solid fa-phone text-slate-400 w-4 text-center mt-0.5"></i>
            <div>
              <span class="text-[10px] text-gray-400 uppercase font-bold block">মোবাইল</span>
              <span class="text-gray-700 font-extrabold" id="details-member-phone">-</span>
            </div>
          </div>
        </div>
        
        <button onclick="closeDetailsModal()" class="w-full py-2.5 rounded-xl text-xs font-black bg-slate-100 text-slate-700 hover:bg-slate-200 transition">বন্ধ করুন</button>
      </div>
    </div>
  </div>

</div>
 
<script>
  // নামের প্রথম অক্ষর আলাদা করার গ্লোবাল জাভাস্ক্রিপ্ট হেল্পার
  function getBengaliInitials(name) {
    var cleanName = name.replace(/^(মোঃ|মো:|মোহাম্মদ|শ্রী|এম.ডি.|md\.|md)/i, '').trim();
    return cleanName ? cleanName.substring(0, 1) : name.substring(0, 1);
  }

  // পপআপ মডাল কন্ট্রোল ফাংশনসমূহ (গ্লোবাল স্কোপ নিশ্চিত করার জন্য window অবজেক্টে রাখা হয়েছে)
  window.openPhoneModal = function(name, designation, phone) {
    document.getElementById('modal-member-name').innerText = name;
    document.getElementById('modal-member-designation').innerText = designation;
    document.getElementById('modal-phone-link').innerText = phone;
    document.getElementById('modal-phone-link').href = "tel:" + phone;
    document.getElementById('modal-call-btn').href = "tel:" + phone;
    
    var modal = document.getElementById('phone-modal');
    modal.classList.remove('hidden');
  }

  window.closePhoneModal = function() {
    document.getElementById('phone-modal').classList.add('hidden');
  }

  window.openDetailsModal = function(name, designation, phone, org) {
    document.getElementById('details-member-name').innerText = name;
    document.getElementById('details-member-designation').innerText = designation;
    document.getElementById('details-member-phone').innerText = phone;
    document.getElementById('details-member-org').innerText = org || 'বিস্তারিত নেই';
    
    var modal = document.getElementById('details-modal');
    modal.classList.remove('hidden');
  }

  window.closeDetailsModal = function() {
    document.getElementById('details-modal').classList.add('hidden');
  }

  (function() {
    google.script.run
      .withSuccessHandler(function(data) {
        document.getElementById('committee-loader').classList.add('hidden');
        if (!data || data.error) return;
        
        var advGrid = document.getElementById('advisors-grid');
        var execGrid = document.getElementById('executives-grid');
        
        advGrid.innerHTML = '';
        execGrid.innerHTML = '';
        
        var hasAdvisors = false;
        var hasExecutives = false;
        
        // কার্ডের ওপরে ডাইনামিক হেডার কালার থিমসমূহ
        var colorClasses = [
          "bg-emerald-600",
          "bg-blue-600",
          "bg-purple-600",
          "bg-amber-500",
          "bg-rose-500",
          "bg-pink-600",
          "bg-teal-500",
          "bg-indigo-600"
        ];
        
        data.forEach(function(member, idx) {
          var initial = getBengaliInitials(member.name);
          var bgHeaderColor = colorClasses[idx % colorClasses.length];
          
          // মেম্বারের ছবি অথবা নামের প্রথম অক্ষরের ব্লক নির্ধারণ ও স্কয়ার হোভার ইফেক্ট যুক্তকরণ
          var avatarHtml = '';
          if (member.photo && member.photo.trim() !== "" && !member.photo.includes("unsplash.com/photo-1507003211169-0a1dd7228f2d")) {
            avatarHtml = `<img class="w-16 h-16 rounded-2xl border-4 border-white/95 object-cover shadow-md transition-all duration-300 ease-out transform hover:scale-110 hover:-translate-y-1.5 hover:rotate-3 cursor-pointer" src="${member.photo}" alt="${member.name}">`;
          } else {
            avatarHtml = `
              <div class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm border-4 border-white/95 text-white text-2xl font-black flex items-center justify-center shadow-md transition-all duration-300 ease-out transform hover:scale-110 hover:-translate-y-1.5 hover:rotate-3 cursor-pointer">
                ${initial}
              </div>
            `;
          }

          // জাভাস্ক্রিপ্ট প্যারামিটার এস্কেপিং (সিঙ্গেল কোটজনিত ক্র্যাশ এড়াতে)
          var safeName = member.name.replace(/'/g, "\\'");
          var safeDesignation = member.designation.replace(/'/g, "\\'");
          var safeOrg = member.org ? member.org.replace(/'/g, "\\'") : '';

          var cardHtml = `
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-300">
              <div>
                <!-- কার্ডের ওপরের রঙিন হেডার: নাম, পদবী এবং স্কয়ার ফ্রেম ছবি এখন এর ভেতরেই এলাইনড -->
                <div class="relative h-44 ${bgHeaderColor} flex flex-col items-center justify-center overflow-hidden pt-4 pb-3 px-4">
                  <!-- নান্দনিক সাদা বর্ডারযুক্ত স্কয়ার ফ্রেমের ছবি/অক্ষর -->
                  <div class="mb-2">
                    ${avatarHtml}
                  </div>
                  <!-- নাম (হোয়াইট কালার) -->
                  <h4 class="font-extrabold text-white text-sm sm:text-base leading-tight text-center truncate w-full drop-shadow-sm">${member.name}</h4>
                  <!-- পদবি ব্যাজ (সেমি-ট্রান্সপারেন্ট হোয়াইট কালার) -->
                  <span class="mt-1.5 px-3 py-0.5 rounded-full text-[10px] font-black bg-white/15 text-white border border-white/10 tracking-wider">
                    ${member.designation}
                  </span>
                </div>

                <!-- সদস্যের বিবরণী বডি -->
                <div class="p-5 pb-0">
                  <div class="space-y-3 text-xs text-left text-gray-600">
                    <!-- পেশা বা সংগঠন -->
                    <div class="flex items-start gap-2.5">
                      <i class="fa-solid fa-briefcase text-emerald-500 w-4 text-center mt-0.5 text-sm"></i>
                      <div>
                        <span class="text-[9px] text-gray-400 uppercase font-bold block leading-none">পেশা ও সংগঠন</span>
                        <span class="text-gray-700 font-bold leading-tight mt-0.5 block">${member.org || 'বিস্তারিত নেই'}</span>
                      </div>
                    </div>
                    <!-- স্থায়ী ঠিকানা -->
                    <div class="flex items-start gap-2.5">
                      <i class="fa-solid fa-location-dot text-amber-500 w-4 text-center mt-0.5 text-sm"></i>
                      <div>
                        <span class="text-[9px] text-gray-400 uppercase font-bold block leading-none">ঠিকানা</span>
                        <span class="text-gray-500 font-medium leading-tight mt-0.5 block">আউলিয়াপুর ইউনিয়ন, পটুয়াখালী সদর</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div> 

              <!-- ফুটার সেকশন: কল বাটন ও ফেসবুকের পাশে বিস্তারিত বাটন -->
              <div class="p-5 pt-0">
                <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                  <!-- কল বাটন (পপআপ ট্রিগার করবে) -->
                  <button onclick="openPhoneModal('${safeName}', '${safeDesignation}', '${member.phone}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-phone text-[10px]"></i> কল করুন
                  </button>
                  
                  <div class="flex items-center gap-1.5">
                    <!-- বিস্তারিত বাটন (পপআপ ট্রিগার করবে) -->
                    <button onclick="openDetailsModal('${safeName}', '${safeDesignation}', '${member.phone}', '${safeOrg}')" class="px-2.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-[10px] transition">
                      <i class="fa-solid fa-circle-info mr-0.5"></i> বিস্তারিত
                    </button>
                    <!-- ফেসবুক লিঙ্ক বাটন -->
                    <a href="#" target="_blank" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100 transition shadow-inner">
                      <i class="fa-brands fa-facebook-f text-xs"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          `;
          
          if (member.type === "উপদেষ্টা মণ্ডলী") {
            advGrid.innerHTML += cardHtml;
            hasAdvisors = true;
          } else if (member.type === "কার্যনির্বাহী কমিটি") {
            execGrid.innerHTML += cardHtml;
            hasExecutives = true;
          }
        });
        
        if (!hasAdvisors) {
          advGrid.innerHTML = '<div class="col-span-full text-center py-6 text-sm text-gray-400">কোনো উপদেষ্টা যুক্ত করা হয়নি</div>';
        }
        if (!hasExecutives) {
          execGrid.innerHTML = '<div class="col-span-full text-center py-6 text-sm text-gray-400">কোনো পরিচালনা সদস্য যুক্ত করা হয়নি</div>';
        }
      })
      .getCommitteeData();
  })();
</script>
