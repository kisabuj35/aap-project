  // ফ্রন্টএন্ডে প্রজেক্ট পেজটি ডাইনামিকালি সাজানোর মাস্টার ফাংশন (১০০% ছবির মতো নিখুঁত!)
  function renderProjectData(projectName) {
    var meta = projectMetadata[projectName];
    if (!meta) return;

    // ১. ব্যানার ও পরিচিতি আপডেট
    document.getElementById('p-title').innerText = projectName;
    document.getElementById('p-subtitle').innerText = meta.subtitle;
    document.getElementById('p-desc').innerText = meta.desc;
    
    // ব্যানার থিম কালার ফিক্সড
    var banner = document.getElementById('p-banner');
    banner.className = `bg-gradient-to-r ${meta.themeColor} p-8 sm:p-10 rounded-3xl text-white text-center shadow-lg relative overflow-hidden`;

    var iconBox = document.getElementById('p-icon-box');
    iconBox.className = `${meta.accentBg} ${meta.textColor} p-5 rounded-2xl text-2xl shrink-0`;
    
    var icon = document.getElementById('p-icon');
    icon.className = `fa-solid ${meta.icon}`;

    // ২. পরিসংখ্যান কার্ড টাইটেল ও ডাটা লোড
    safeSetText('p-card-1-title', meta.cards[0]);
    safeSetText('p-card-1-val', "...+"); // লাইভ ডাটা লোড হওয়ার আগে ডিফল্ট
    
    safeSetText('p-card-2-title', meta.cards[1]);
    safeSetText('p-card-2-val', meta.cards[0].includes("গাছ") ? "২০+" : "১০০+");
    
    safeSetText('p-card-3-title', meta.cards[2]);
    safeSetText('p-card-3-val', meta.cards[2].includes("চলমান") ? (meta.cards[0].includes("গাছ") ? "৭ বছর" : "৫ বছর") : "৩ বছর");
    
    safeSetText('p-card-4-title', meta.cards[3]);
    safeSetText('p-card-4-val', meta.cards[3].includes("উপজেলা") ? "৪টি" : "৫টি");

    // ৩. লক্ষ্যসমূহ রেন্ডার
    var goalsContainer = document.getElementById('p-goals-container');
    goalsContainer.innerHTML = '';
    meta.goals.forEach((goal, idx) => {
      goalsContainer.innerHTML += `
        <div class="flex items-start gap-3">
          <div class="w-6 h-6 rounded-full bg-emerald-50 text-emerald-600 text-[10px] font-black flex items-center justify-center shrink-0 mt-0.5">${toBnDigits(idx + 1)}</div>
          <p class="text-xs text-gray-500 font-semibold leading-relaxed">${goal}</p>
        </div>
      `;
    });

    // ৪. অর্জনসমূহ রেন্ডার
    var achieveContainer = document.getElementById('p-achieve-container');
    achieveContainer.innerHTML = '';
    meta.achievements.forEach(ach => {
      achieveContainer.innerHTML += `
        <div class="flex items-start gap-3">
          <div class="w-6 h-6 rounded-full bg-amber-50 text-amber-500 text-xs font-black flex items-center justify-center shrink-0 mt-0.5"><i class="fa-solid fa-circle-check"></i></div>
          <p class="text-xs text-gray-500 font-semibold leading-relaxed">${ach}</p>
        </div>
      `;
    });

    // ৫. প্রধান কার্যক্রমসমূহ রেন্ডার
    var actContainer = document.getElementById('p-activities-container');
    actContainer.innerHTML = '';
    meta.activities.forEach((act, idx) => {
      actContainer.innerHTML += `
        <div class="bg-slate-50/60 border border-slate-100 p-4 rounded-xl flex items-center gap-3">
          <div class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 text-[10px] font-bold flex items-center justify-center shrink-0">${toBnDigits(idx + 1)}</div>
          <span class="text-xs text-gray-600 font-bold">${act}</span>
        </div>
      `;
    });

    // ৬. সময়রেখা (Timeline) ইনিশিয়াল লোড
    var timelineContainer = document.getElementById('p-timeline-container');
    timelineContainer.innerHTML = '';
    meta.defaultTimelines.forEach(t => {
      timelineContainer.innerHTML += `
        <div class="bg-slate-50/60 border border-slate-100 p-4 rounded-2xl flex items-start gap-4">
          <div class="bg-emerald-50 text-emerald-700 w-12 h-10 rounded-xl flex items-center justify-center shrink-0 font-black text-xs shadow-sm">${toBnDigits(t.year)}</div>
          <p class="text-[11px] sm:text-xs text-gray-500 font-semibold mt-1.5 leading-relaxed">${t.text}</p>
        </div>
      `;
    });

    // ৭. প্রভাব ব্যানার থিম সিঙ্ক
    var impactBanner = document.getElementById('p-impact-banner');
    impactBanner.className = `p-6 sm:p-8 rounded-[32px] border text-white text-center space-y-2.5 shadow-md bg-gradient-to-br ${meta.themeColor}`;
    safeSetText('p-impact-desc', meta.impact);

    // ৮. **গুগল শিট থেকে রিয়েল-টাইম ডাটা রিড ফিক্স (লাইভ কানেকশন!)**
    google.script.run
      .withSuccessHandler(function(stats) {
        if (stats && stats.success) {
          // যদি ডাটাবেজে এই প্রজেক্টের রোপণ/বিতরণ করা কোনো সংখ্যা থাকে তবে প্রথম কার্ডে আপডেট হবে
          if (stats.totalAmount !== "০") {
            safeSetText('p-card-1-val', stats.totalAmount + "+");
          }
          if (stats.totalEntries !== "০") {
            safeSetText('p-card-2-val', stats.totalEntries + "+");
          }

          // যদি ডাটাবেজে কাস্টম সময়রেখা এন্ট্রি থাকে তবে তা সময়রেখার ওপরে পুশ হবে
          if (stats.timelines && stats.timelines.length > 0) {
            stats.timelines.forEach(t => {
              timelineContainer.innerHTML = `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-start gap-4 hover:border-emerald-400 hover:scale-[1.01] transition duration-200">
                  <div class="bg-emerald-50 text-emerald-700 w-12 h-10 rounded-xl flex items-center justify-center shrink-0 font-black text-xs shadow-sm">${t.year}</div>
                  <p class="text-[11px] sm:text-xs text-gray-500 font-semibold mt-1.5 leading-relaxed">${t.text}</p>
                </div>
              ` + timelineContainer.innerHTML;
            });
          }
        }
      })
      .getLiveProjectStats(projectName);
  }

  // বাংলা সংখ্যা রূপান্তরকারী (জাভাস্ক্রিপ্ট)
  function toBnDigits(str) {
    if (str === undefined || str === null) return "০";
    var bnDigits = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
    return str.toString().replace(/[0-9]/g, function(w) { return bnDigits[+w]; });
  }
</script>
