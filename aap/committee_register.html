<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="text-center mb-8">
    <h3 class="text-3xl font-extrabold text-gray-800">কমিটি সদস্য ফর্ম</h3>
    <p class="text-gray-500 mt-2">উপদেষ্টা মণ্ডলী এবং কার্যনির্বাহী কমিটির নতুন সদস্যদের তথ্য স্লিপ</p>
    <div class="w-16 h-1 bg-emerald-500 mx-auto mt-3 rounded-full"></div>
  </div>

  <form id="comm-form" onsubmit="submitCommittee(event)" class="bg-white p-8 rounded-2xl shadow-md border border-gray-100 space-y-6">
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">১. কমিটির ধরণ *</label>
      <select id="comm-type" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none bg-white">
        <option value="উপদেষ্টা মণ্ডলী">উপদেষ্টা মণ্ডলী</option>
        <option value="কার্যনির্বাহী কমিটি">কার্যনির্বাহী কমিটি</option>
        <option value="ডোনার ও পার্টনার">ডোনার ও শুভাকাঙ্ক্ষী </option>
      </select>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">২. নাম *</label>
        <input type="text" id="comm-name" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">৩. মোবাইল নম্বর *</label>
        <input type="tel" id="comm-phone" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">৪. পদবী *</label>
        <input type="text" id="comm-desig" placeholder="যেমন: প্রধান উপদেষ্টা, সভাপতি, সাধারণ সম্পাদক" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">৫. ফেসবুক লিংক (অপশনাল)</label>
        <input type="url" id="comm-fb" placeholder="যেমন: https://facebook.com/username" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- নতুন যুক্ত হওয়া ইনপুট পেশা এবং শিক্ষাগত যোগ্যতা -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">৬. পেশা *</label>
        <input type="text" id="comm-profession" placeholder="যেমন: শিক্ষক, ব্যবসায়ী" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">৭. শিক্ষাগত যোগ্যতা *</label>
        <input type="text" id="comm-education" placeholder="যেমন: বি.এ. (অনার্স), এম.এ." required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">৮. কর্মস্থল বা প্রতিষ্ঠানের নাম *</label>
      <input type="text" id="comm-org" value="আউলিয়াপুর অগ্রযাত্রা পরিষদ" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
    </div>

    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">৯. বাণী / সংগঠনের উদ্দেশ্যমূলক বার্তা (ঐচ্ছিক)</label>
      <textarea id="comm-message" rows="3" placeholder="যেমন: আউলিয়াপুর অগ্রযাত্রা পরিষদ সুন্দর সমাজ বিনির্মাণে..." class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-700 focus:ring-2 focus:ring-emerald-400 focus:outline-none"></textarea>
    </div>

    <div>
      <!-- রিকোয়ার্ড বা রিস্ট্রিকশন তুলে নেওয়া হয়েছে, ছবি ঐচ্ছিক -->
      <label class="block text-xs font-bold text-gray-700 mb-1">১০. সদস্যের এক কপি ছবি আপলোড করুন (ঐচ্ছিক)</label>
      <input type="file" id="comm-photo" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
    </div>

    <div class="pt-4">
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 flex items-center justify-center">
        <i class="fa-solid fa-user-shield mr-2"></i> কমিটির তথ্য সাবমিট করুন
      </button>
    </div>
  </form>
</div>

<script>
  var commPhotoBase64 = "";
  var commPhotoName = "";

  document.getElementById('comm-photo').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) {
      commPhotoBase64 = "";
      commPhotoName = "";
      return;
    }
    commPhotoName = file.name;
    var reader = new FileReader();
    reader.onload = function(evt) { commPhotoBase64 = evt.target.result; };
    reader.readAsDataURL(file);
  });

  function submitCommittee(e) {
    e.preventDefault();
    document.getElementById('loading').classList.remove('hidden');

    var payload = {
      type: document.getElementById('comm-type').value,
      name: document.getElementById('comm-name').value,
      phone: document.getElementById('comm-phone').value,
      designation: document.getElementById('comm-desig').value,
      fbLink: document.getElementById('comm-fb').value,
      org: document.getElementById('comm-org').value,
      message: document.getElementById('comm-message').value,
      profession: document.getElementById('comm-profession').value,
      education: document.getElementById('comm-education').value,
      photoData: commPhotoBase64,
      photoName: commPhotoName
    };

    google.script.run
      .withSuccessHandler(function(res) {
        document.getElementById('loading').classList.add('hidden');
        if (res.success) {
          showCustomAlert("সফল হয়েছে!", "কমিটির সদস্যের তথ্য সফলভাবে ডাটাবেজে যুক্ত হয়েছে!", "success", function() {
            document.getElementById('comm-form').reset();
            commPhotoBase64 = "";
            commPhotoName = "";
            navigateTo('home');
          });
        } else {
          showCustomAlert("ব্যর্থ হয়েছে!", "ডাটা আপলোড করা যায়নি: " + res.error, "error");
        }
      })
      .submitCommitteeMember(payload);
  }
</script>
